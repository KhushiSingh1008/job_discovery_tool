[project]
name = "gradguide-jobs"
version = "0.1.0"
description = "Job discovery tool for international students in the UK, backed by a custom scraper."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "requests>=2.32",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.8",
    "types-python-dateutil",
    "types-requests",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["app"]
