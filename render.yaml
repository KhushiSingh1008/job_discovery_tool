# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# One web service runs the API, serves the React app and scrapes daily; the SQLite
# database lives on a persistent disk. (A Render Cron Job cannot reach this disk, which
# is why the scrape is scheduled inside the web service.)
services:
  - type: web
    name: gradguide-jobs
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # persistent disks need a paid instance
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: gradguide-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GG_DATABASE_PATH
        value: /data/jobs.db
      - key: GG_SCRAPE_INTERVAL_HOURS
        value: "24"
      - key: GG_RESUME_REQUESTS_PER_HOUR
        value: "30"
      # Optional: enables AI resume suggestions. Paste it in the Render dashboard when
      # prompted; it is never stored in the repository.
      - key: ANTHROPIC_API_KEY
        sync: false
